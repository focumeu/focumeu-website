<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Focu Meu – Ristorante & Bar</title>
    <meta
      name="description"
      content="Cucina calabrese, brace e aperitivi sul mar Ionio a Sant'Andrea Apostolo dello Ionio. A pochi minuti da Soverato."
    />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d24b1b" />

    <!-- Open Graph / anteprime social -->
    <meta property="og:site_name" content="Focu Meu" />
    <meta
      property="og:title"
      content="Focu Meu – Dall'Alba al Tramonto sulla Costa Ionica"
    />
    <meta
      property="og:description"
      content="Cucina calabrese, cocktail e brace sul mare Ionio. A Sant'Andrea Apostolo dello Ionio, pochi minuti da Soverato."
    />
    <meta property="og:image" content="https://focu-meu.it/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="La terrazza di Focu Meu affacciata sul mare Ionio"
    />
    <meta property="og:url" content="https://focu-meu.it/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://focu-meu.it/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Immagine hero: scaricata subito (è l'elemento più grande della pagina).
         Due preload alternativi, uguali alle sorgenti del <picture> della hero. -->
    <link
      rel="preload"
      as="image"
      media="(max-aspect-ratio: 4/5)"
      imagesrcset="
        /assets/images/sala-portrait-600.webp 600w,
        /assets/images/sala-portrait-840.webp 840w
      "
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(min-aspect-ratio: 4001/5000)"
      imagesrcset="
        /assets/images/sala-640.webp   640w,
        /assets/images/sala-1024.webp 1024w,
        /assets/images/sala-1440.webp 1440w,
        /assets/images/sala.webp      1971w
      "
      imagesizes="(max-aspect-ratio: 3/2) 150vh, 100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/fonts/Ribes-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/ZalandoSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Google Analytics e Meta Pixel NON vengono caricati qui:
      vengono iniettati da AnalyticsService / MetaPixelService
      solo dopo il consenso dell'utente (banner cookie).
    -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
