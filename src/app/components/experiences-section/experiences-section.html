<section id="experience" class="experience">
  <div class="container">
    <header class="experience__head">
      <p class="eyebrow" appReveal>{{ 'EXPERIENCE.EYEBROW' | translate }}</p>
      <h2 class="section-title" appReveal>{{ 'EXPERIENCE.TITLE' | translate }}</h2>
    </header>

    <ul class="experience__list">
      @for (item of items; track item.title; let i = $index) {
      <li class="card" appReveal [revealDelay]="i * 120">
        <span class="card__num">0{{ i + 1 }}</span>
        <span
          class="illo card__illo"
          [style.--illo]="'url(' + item.illo + ')'"
          aria-hidden="true"
        ></span>
        <h3 class="card__title">{{ item.title | translate }}</h3>
        <p class="card__text">{{ item.text | translate }}</p>
      </li>
      }
    </ul>
  </div>
</section>
