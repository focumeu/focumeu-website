<!-- ═══ HERO OPZIONE B: fotografica con navbar integrata visivamente ═══ -->
<section class="hero-fullscreen" id="hero">
  <div class="hero-overlay"></div>

  <img
    src="/assets/images/sala.webp"
    alt="Focu Meu restaurant"
    class="hero-img"
    loading="lazy"
    priority
  />

  <div class="hero-content">
    <!-- ═══════════════════════════════════════════════════════════════
         STATO ATTUALE — CHIUSURA STAGIONE
         A fine stagione viene mostrato questo messaggio.
         ═══════════════════════════════════════════════════════════════ -->

    <div class="season-closed">
      <p class="hero-payoff">{{ 'HERO.SEASON-CLOSED.TITLE' | translate }}</p>

      <p class="season-message">
        {{ 'HERO.SEASON-CLOSED.MESSAGE' | translate }}
      </p>

      <p class="season-social">
        {{ 'HERO.SEASON-CLOSED.SOCIAL-TEXT' | translate }}
      </p>

      <div class="social-buttons">
        <a
          class="social-btn"
          href="https://www.facebook.com/profile.php?id=61573220798900"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Facebook</span>
        </a>

        <a
          class="social-btn"
          href="https://www.instagram.com/focumeu_it"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Instagram</span>
        </a>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
