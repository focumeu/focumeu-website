<section id="faq" class="faq wave-bg">
  <div class="container faq__grid">
    <header class="faq__head">
      <p class="eyebrow" appReveal>{{ 'FAQ.EYEBROW' | translate }}</p>
      <h2 class="section-title" appReveal>{{ 'FAQ.TITLE' | translate }}</h2>
      <p class="faq__intro" appReveal>{{ 'FAQ.INTRO' | translate }}</p>

      <div class="faq__more" appReveal>
        <p>{{ 'FAQ.MORE' | translate }}</p>
        <a
          class="btn btn--light"
          href="https://wa.me/393516372505?text=Ciao%20Focu%20Meu,%20vorrei%20ricevere%20informazioni."
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ 'FAQ.MORE-CTA' | translate }}
        </a>
      </div>

      <span
        class="illo faq__illo"
        style="--illo: url(/assets/illustrations/sardines_sand-560.webp)"
        aria-hidden="true"
      ></span>
    </header>

    <div class="faq__list" appReveal>
      @for (n of questions; track n) {
      <app-faq-item
        [question]="'FAQ.QUESTION' + n"
        [answer]="'FAQ.ANSWER' + n"
      />
      }
    </div>
  </div>
</section>
