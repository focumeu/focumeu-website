<section id="moments" class="moments wave-bg">
  <div class="container">
    <header class="moments__head">
      <div>
        <p class="eyebrow" appReveal>{{ 'MOMENTS.EYEBROW' | translate }}</p>
        <h2 class="section-title" appReveal>{{ 'MOMENTS.TITLE' | translate }}</h2>
      </div>
      <p class="moments__intro" appReveal>{{ 'MOMENTS.INTRO' | translate }}</p>
    </header>
  </div>

  <ul class="moments__gallery" [attr.aria-label]="'MOMENTS.TITLE' | translate">
    @for (photo of photos; track photo.key; let i = $index) {
    <li class="moments__item" [style.--rot]="photo.rot + 'deg'" [style.--y]="photo.y + '%'">
      <figure class="polaroid" appReveal [revealDelay]="i * 90">
        <img
          [src]="photo.src"
          width="640"
          [attr.height]="photo.h"
          sizes="(max-width: 900px) 68vw, 22vw"
          [alt]="'MOMENTS.CAPTIONS.' + photo.key | translate"
          loading="lazy"
          decoding="async"
        />
        <figcaption>{{ 'MOMENTS.CAPTIONS.' + photo.key | translate }}</figcaption>
      </figure>
    </li>
    }
  </ul>

  <p class="moments__hint" aria-hidden="true">
    {{ 'MOMENTS.SWIPE' | translate }} →
  </p>
</section>
