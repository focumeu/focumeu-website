<button
  type="button"
  class="back-to-top"
  [class.visible]="isVisible"
  [attr.aria-label]="'FOOTER.BACK-TOP' | translate"
  [attr.tabindex]="isVisible ? 0 : -1"
  (click)="scrollToTop()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5l-7 7 1.4 1.4L11 8.8V20h2V8.8l4.6 4.6L19 12z" />
  </svg>
</button>
